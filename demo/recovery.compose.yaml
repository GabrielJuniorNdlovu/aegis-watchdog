x-limited: &limited
  image: busybox:1.37.0
  network_mode: none
  user: "65534:65534"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  cpus: 0.1
  mem_limit: 32m
  pids_limit: 12
  restart: "no"

services:
  transient:
    <<: *limited
    command: ["sh", "-c", "rm -f /tmp/hung; (sleep 8; touch /tmp/hung; sleep 2; rm -f /tmp/hung) & while :; do sleep 3600; done"]
    healthcheck:
      test: ["CMD-SHELL", "test ! -e /tmp/hung"]
      interval: 1s
      timeout: 1s
      retries: 1
  self-healing:
    <<: *limited
    command: ["sh", "-c", "while :; do rm -f /tmp/hung; (sleep 8; touch /tmp/hung) & sleep 3600; done"]
    healthcheck:
      test: ["CMD-SHELL", "test ! -e /tmp/hung"]
      interval: 1s
      timeout: 1s
      retries: 1
  persistent:
    <<: *limited
    read_only: true
    volumes:
      - type: bind
        source: ${AEGIS_RECOVERY_CONTROL_DIR:?Set AEGIS_RECOVERY_CONTROL_DIR to a private demo directory}
        target: /control
        read_only: true
    command: ["sh", "-c", "while :; do sleep 3600; done"]
    healthcheck:
      test: ["CMD-SHELL", "test ! -e /control/fault"]
      interval: 1s
      timeout: 1s
      retries: 1
  database:
    <<: *limited
    volumes:
      - type: bind
        source: ${AEGIS_RECOVERY_CONTROL_DIR:?Set AEGIS_RECOVERY_CONTROL_DIR to a private demo directory}
        target: /control
        read_only: true
    command: ["sh", "-c", "while :; do sleep 3600; done"]
    healthcheck:
      test: ["CMD-SHELL", "test ! -e /control/dependency-fault"]
      interval: 1s
      timeout: 1s
      retries: 1
  dependency-no-health:
    <<: *limited
    command: ["sh", "-c", "while :; do sleep 3600; done"]
